[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-forge"
version = "0.1.0"
description = "CTI report -> ATT&CK-mapped Sigma rule -> backtest -> noise score -> SIEM export, in one loop."
requires-python = ">=3.10"

[project.scripts]
detection-forge = "cli.main:app"

[tool.setuptools]
packages = ["detection_forge", "cli", "webapp"]
